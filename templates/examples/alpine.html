<div x-data="{ html: '<p>Hello from <strong>Alpine</strong>. Type here or use the buttons.</p>', words: 0 }">
  <vanilia-editor x-model="html" @editorupdate="words = $event.detail.words"></vanilia-editor>
  <div class="row">
    <button type="button" @click="html = '<h2>Replaced</h2><p>Set from Alpine state.</p>'">Replace content</button>
    <button type="button" @click="html = ''">Clear</button>
    <span class="hint" x-text="words + (words === 1 ? ' word' : ' words')"></span>
  </div>
  <pre class="output" x-text="html"></pre>
</div>
