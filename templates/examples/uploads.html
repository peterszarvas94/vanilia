<!-- POSTs the raw file to upload-url, which must answer { "url": "..." } -->
<vanilia-editor upload-url="api/upload" placeholder="Paste, drop or insert an image...">
  <template><p>Drop an image here, paste one, or use the image button. Click it to resize and align.</p></template>
</vanilia-editor>
