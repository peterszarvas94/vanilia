<style>
  .paper-editor {
    --ve-accent: oklch(0.55 0.16 40);
    --ve-bg: light-dark(#fffaf3, #1c1712);
    --ve-surface-bg: light-dark(#fffaf3, #1c1712);
    --ve-chrome-bg: light-dark(#f6ecdd, #241d16);
    --ve-border: light-dark(#e6d6bf, #3a2f24);
    --ve-radius: 4px;
    --ve-font-sans: Georgia, "Times New Roman", serif;
    --ve-font-size: 17px;
    --ve-min-height: 180px;
  }
</style>

<div class="row" id="theme-controls">
  <button type="button" data-theme="light">Light</button>
  <button type="button" data-theme="dark">Dark</button>
  <button type="button" data-theme="auto">Auto</button>
  <label>Accent <input type="color" value="#b45309" data-accent /></label>
  <button type="button" data-reset>Reset accent</button>
</div>

<vanilia-editor id="theme-editor" class="paper-editor">
  <template>
    <h2>A warmer page</h2>
    <p>Every color, radius, font and size is a <code>--ve-*</code> custom property. Dark mode follows <code>color-scheme</code>, or pin it with the <code>theme</code> attribute.</p>
  </template>
</vanilia-editor>

<script type="module">
  await customElements.whenDefined("vanilia-editor");
  const editor = document.getElementById("theme-editor");
  const controls = document.getElementById("theme-controls");

  controls.onclick = (e) => {
    const button = e.target.closest("button");
    if (button?.dataset.theme) editor.theme = button.dataset.theme;
    if (button?.hasAttribute("data-reset")) editor.setTheme({ accent: null });
  };
  // setTheme() writes typed --ve-* properties: accent is --ve-accent
  controls.querySelector("[data-accent]").oninput = (e) => {
    editor.setTheme({ accent: e.target.value });
  };
</script>
