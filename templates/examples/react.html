<template id="react-seed">
  <!-- demo-content -->
</template>
<div id="react-root"></div>

<script type="module">
  import "vanilia-editor";
  import { createElement as h, useState } from "react";
  import { createRoot } from "react-dom/client";

  const initialHTML = document.getElementById("react-seed").innerHTML.trim();

  function App() {
    const [html, setHTML] = useState(initialHTML);
    const [words, setWords] = useState(0);

    return h("div", null,
      // Leave the element's children to Vanilia; React controls its value only.
      h("vanilia-editor", {
        value: html,
        "upload-url": "/api/upload",
        oninput: (event) => setHTML(event.currentTarget.value),
        oneditorupdate: (event) => setWords(event.detail.words),
      }),
      h("div", { className: "row" },
        h("button", { type: "button", onClick: () => setHTML(initialHTML) }, "Reset"),
        h("button", {
          type: "button",
          onClick: () => setHTML("<h2>Replaced</h2><p>Set from React state.</p>"),
        }, "Replace content"),
        h("button", { type: "button", onClick: () => setHTML("") }, "Clear"),
        h("span", { className: "hint" }, `${words} ${words === 1 ? "word" : "words"} · ${html.length} characters in React state`),
      ),
    );
  }

  createRoot(document.getElementById("react-root")).render(h(App));
</script>
