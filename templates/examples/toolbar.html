<div class="row" id="toolbar-layouts">
  <button type="button" data-layout="bold italic sup sub | h2 h3 | bulletList orderedList | link date">Compact</button>
  <button type="button" data-layout="">Default</button>
  <button type="button" data-layout="none">None</button>
</div>
<vanilia-editor
  id="toolbar-editor"
  toolbar="bold italic sup sub | h2 h3 | bulletList orderedList | link date"
  bubble-menu="bold italic sup sub | link"
>
  <template>
    <h2>Toolbar layout</h2>
    <p>E = mc<sup>2</sup> and H<sub>2</sub>O come from two custom buttons (or Ctrl+Shift+P and Ctrl+Shift+B). Select some text to see them in the selection menu too. The <em>Date</em> button inserts today's date.</p>
  </template>
</vanilia-editor>

<script type="module">
  await customElements.whenDefined("vanilia-editor");
  const editor = document.getElementById("toolbar-editor");

  // A toggle button for an inline tag, using the underlying Squire instance
  const toggleTag = (name, tag, label, shortcut, icon) =>
    editor.addButton({
      name,
      label,
      shortcut,
      icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">${icon}</svg>`,
      isActive: (editor) => editor.squire.hasFormat(tag),
      run(editor) {
        if (editor.squire.hasFormat(tag)) editor.squire.changeFormat(null, { tag });
        else editor.squire.changeFormat({ tag });
      },
    });

  toggleTag("sup", "SUP", "Superscript", "Mod+Shift+P", '<path d="m4 19 8-8"/><path d="m12 19-8-8"/><path d="M20 12h-4c0-1.5.44-2 1.5-2.5S20 8.33 20 7c0-.47-.17-.93-.48-1.29a2.1 2.1 0 0 0-2.62-.44c-.42.24-.74.61-.9 1.06"/>');
  toggleTag("sub", "SUB", "Subscript", "Mod+Shift+B", '<path d="m4 5 8 8"/><path d="m12 5-8 8"/><path d="M20 19h-4c0-1.5.44-2 1.5-2.5S20 15.33 20 14c0-.47-.17-.93-.48-1.29a2.1 2.1 0 0 0-2.62-.44c-.42.24-.74.62-.9 1.07"/>');

  editor.addButton({
    name: "date",
    label: "Insert today's date",
    icon: "text",
    text: "Date",
    run: (editor) => editor.insertText(new Date().toLocaleDateString()),
  });

  // The toolbar property takes a layout string, an array, "none" or null (the default)
  document.getElementById("toolbar-layouts").onclick = (e) => {
    const button = e.target.closest("[data-layout]");
    if (button) editor.toolbar = button.dataset.layout || null;
  };
</script>
