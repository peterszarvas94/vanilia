{{define "head"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{if .Title}}{{.Title}} · {{end}}Vanilia</title>
    <meta name="description" content="Vanilia is a drop-in rich text editor web component: one custom element, three static files, no build step." />
    <link rel="icon" href="{{.BasePath}}/static/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem("vanilia-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "squire-rte": "{{.BasePath}}/dist/squire.mjs",
          "vanilia-editor": "{{.BasePath}}/dist/vanilia-editor.js",
          "datastar": "{{.BasePath}}/static/vendor/datastar.js"
        }
      }
    </script>
    <link rel="modulepreload" href="{{.BasePath}}/dist/squire.mjs" />
    <link rel="stylesheet" href="{{.BasePath}}/dist/vanilia-editor.css" />
    <link rel="stylesheet" href="{{.BasePath}}/static/site.css" />
    <script type="module" src="{{.BasePath}}/static/site.js"></script>
{{end}}

{{define "nav"}}
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main">
        <a class="logo" href="{{.BasePath}}/">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--accent)"/><path d="M7 8l5 9 5-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Vanilia
        </a>
        <ul class="nav-links">
          <li><a href="{{.BasePath}}/docs" {{if eq .Active "docs"}}aria-current="page"{{end}}>Docs</a></li>
          <li><a href="{{.BasePath}}/examples" {{if eq .Active "examples"}}aria-current="page"{{end}}>Examples</a></li>
          <li><a href="{{.BasePath}}/demo" {{if eq .Active "demo"}}aria-current="page"{{end}}>Demo</a></li>
          <li><a href="https://github.com/peterszarvas94/vanilla-wysiwyg" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        </ul>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle color theme" title="Theme: system">
          <svg class="theme-icon theme-icon--system" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a6.5 6.5 0 1 0 9 9 9 9 0 1 1-9-9"/></svg>
        </button>
      </nav>
    </header>
{{end}}

{{define "foot"}}
    <footer class="site-footer">
      <p>
        Vanilia · MIT · built on <a href="https://github.com/fastmail/Squire" target="_blank" rel="noopener noreferrer">Squire</a>
        · <a href="https://github.com/peterszarvas94/vanilla-wysiwyg" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
      </p>
    </footer>
{{end}}

{{define "code"}}<div class="code-block"><button type="button" class="copy-btn" data-copy>Copy</button><pre><code>{{.}}</code></pre></div>{{end}}
