{{define "head"}}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{if .Title}}{{.Title}} · {{end}}Vanilia</title>
    <meta name="description" content="Vanilia is a drop-in rich text editor web component: one custom element, one ES module and one stylesheet, no build step." />
    <link rel="icon" href="{{.BasePath}}/static/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        const t = localStorage.getItem("vanilia-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "vanilia-editor": "{{.BasePath}}/dist/vanilia-editor.js",
          "datastar": "{{.BasePath}}/static/vendor/datastar.js",
          "site": "{{.BasePath}}/static/site.js",
          "htmx.org": "{{.BasePath}}/static/vendor/htmx.esm.js",
          "alpinejs": "{{.BasePath}}/static/vendor/alpine.esm.js",
          "alpine": "{{.BasePath}}/static/alpine.js"
        }
      }
    </script>
    <link rel="modulepreload" href="{{.BasePath}}/dist/vanilia-editor.js" />
    <link rel="modulepreload" href="{{.BasePath}}/static/vendor/datastar.js" />
    <link rel="modulepreload" href="{{.BasePath}}/static/site.js" />
    <link rel="stylesheet" href="{{.BasePath}}/dist/vanilia-editor.css" />
    <link rel="stylesheet" href="{{.BasePath}}/static/site.css" />
    <!-- The one module entry point: the editor first, so Datastar finds it defined -->
    <script type="module">
      import "vanilia-editor";
      import "datastar";
      import "site";
      {{range .Modules}}import "{{.}}";
      {{end}}
    </script>
{{end}}

{{define "nav"}}
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main">
        <a class="logo" href="{{.BasePath}}/">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="6" fill="var(--accent)"/><path d="M7 8l5 9 5-9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Vanilia
        </a>
        <ul class="nav-links">
          <li><a href="{{.BasePath}}/docs" {{if eq .Active "docs"}}aria-current="page"{{end}}>Docs</a></li>
          <li><a href="{{.BasePath}}/examples" {{if eq .Active "examples"}}aria-current="page"{{end}}>Examples</a></li>
          <li><a href="{{.BasePath}}/demo" {{if eq .Active "demo"}}aria-current="page"{{end}}>Demo</a></li>
          <li>
            <a class="nav-icon" href="https://github.com/peterszarvas94/vanilia" target="_blank" rel="noopener noreferrer" aria-label="GitHub" title="GitHub">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.2 1.77 1.2 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.42-2.69 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
            </a>
          </li>
        </ul>
        <button type="button" class="icon-btn" aria-label="Toggle color theme"
          data-signals:_theme="document.documentElement.dataset.theme || 'system'"
          data-attr:title="'Theme: ' + $_theme"
          data-on:click="$_theme = ({system: 'light', light: 'dark', dark: 'system'})[$_theme]; @theme($_theme)">
          <svg class="theme-icon theme-icon--system" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
          <svg class="theme-icon theme-icon--light" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="theme-icon theme-icon--dark" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a6.5 6.5 0 1 0 9 9 9 9 0 1 1-9-9"/></svg>
        </button>
      </nav>
    </header>
{{end}}

{{define "foot"}}
    <footer class="site-footer">
      <p>
        Vanilia · MIT · built on <a href="https://github.com/fastmail/Squire" target="_blank" rel="noopener noreferrer">Squire</a>
        · <a href="https://github.com/peterszarvas94/vanilia" target="_blank" rel="noopener noreferrer">Source on GitHub</a>
      </p>
    </footer>
{{end}}

{{define "code"}}<div class="code-block"><button type="button" class="copy-btn" data-on:click="@copy(el)">Copy</button><pre><code data-highlight>{{.}}</code></pre></div>{{end}}

{{define "sidebar-toggle"}}<button type="button" class="sidebar-toggle" popovertarget="sidebar" aria-label="Open {{.}} menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span data-signals:_section="'{{.}}'" data-text="$_section">{{.}}</span>
        <svg class="sidebar-toggle-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>{{end}}
